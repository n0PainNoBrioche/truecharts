{{/* Make sure all variables are set properly */}}
{{- include "tc.v1.common.loader.init" . }}

{{/* Render the config for securo */}}
{{- $config := include "securo.config" . | fromYaml -}}
{{- if $config -}}
  {{- $_ := set .Values.configmap "config" $config -}}
{{- end -}}

{{/* Render the secrets for securo */}}
{{- $secrets := include "securo.secrets" . | fromYaml -}}
{{- if $secrets -}}
  {{- $_ := set .Values.secret "secrets" $secrets -}}
{{- end -}}

{{/* Render the templates */}}
{{ include "tc.v1.common.loader.apply" . }}
